<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TableTrack</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="logo-header">
      <img src="assets/logo.png" alt="TableTrack Logo" class="logo" />
      <h1 class="title">TableTrack</h1>
    </header>
    <div class="button-grid">
      <a href="#" class="button">
        <img src="assets/match.png" alt="Match" />
        <span>Wedstrijd</span>
      </a>
      <a href="#" class="button">
        <img src="assets/draw.png" alt="Draw" />
        <span>Vrij Tekenen</span>
      </a>
      <a href="#" class="button">
        <img src="assets/training.png" alt="Training" />
        <span>Training</span>
      </a>
      <a href="#" class="button">
        <img src="assets/analysis.png" alt="Analyse" />
        <span>Analyse</span>
      </a>
    </div>
    <a href="#" class="button settings">
      <img src="assets/settings.png" alt="Instellingen" />
      <span>Instellingen</span>
    </a>
  </div>
</body>
</html>
