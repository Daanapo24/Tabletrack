
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PingCoach v3.1</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    #setup {
      margin: 10px;
      text-align: center;
    }
    #scoreboard {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin: 10px;
      font-size: 20px;
    }
    .server {
      border-bottom: 2px solid yellow;
    }
    #canvas-container {
      width: 70vw;
      aspect-ratio: 1 / 2;
      max-height: 70vh;
      position: relative;
    }
    #canvas {
      width: 100%;
      height: 100%;
      background: black;
      border: 2px solid white;
      touch-action: none;
    }
    #controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin: 10px;
    }
    button, select {
      padding: 10px;
      background: #222;
      color: white;
      border: 1px solid white;
      min-width: 80px;
    }
  </style>
</head>
<body>
  <div id="setup">
    <label>Best of:
      <select id="bestOf">
        <option value="3">Best of 3</option>
        <option value="5" selected>Best of 5</option>
        <option value="7">Best of 7</option>
      </select>
    </label>
    <label>Start server:
      <select id="startServer">
        <option value="A" selected>Speler A</option>
        <option value="B">Speler B</option>
      </select>
    </label>
    <button onclick="startMatch()">Start</button>
  </div>

  <div id="scoreboard" style="display: none;">
    <div id="playerA" class="server">Speler A: <span id="scoreA">0</span></div>
    <div id="playerB">Speler B: <span id="scoreB">0</span></div>
  </div>

  <div id="canvas-container">
    <canvas id="canvas" width="300" height="600"></canvas>
  </div>

  <div id="controls" style="display: none;">
    <button onclick="addPoint('A')">+1 A</button>
    <button onclick="addPoint('B')">+1 B</button>
    <button onclick="removePoint('A')">-1 A</button>
    <button onclick="removePoint('B')">-1 B</button>
    <button onclick="clearCanvas()">Wis</button>
    <button onclick="setColor('green')">Winner</button>
    <button onclick="setColor('red')">Fout</button>
    <button onclick="setColor('white')">Wit</button>
  </div>

  <script>
    let scoreA = 0, scoreB = 0, totalPoints = 0, currentServer = 'A';
    let color = 'white';
    let bestOf = 5;
    const ctx = document.getElementById('canvas').getContext('2d');
    const scoreElA = document.getElementById('scoreA');
    const scoreElB = document.getElementById('scoreB');

    function startMatch() {
      bestOf = parseInt(document.getElementById("bestOf").value);
      currentServer = document.getElementById("startServer").value;
      document.getElementById("playerA").classList.remove("server");
      document.getElementById("playerB").classList.remove("server");
      document.getElementById("player" + currentServer).classList.add("server");
      document.getElementById("scoreboard").style.display = "flex";
      document.getElementById("controls").style.display = "flex";
      document.getElementById("setup").style.display = "none";
    }

    function updateScore() {
      scoreElA.textContent = scoreA;
      scoreElB.textContent = scoreB;
    }

    function switchServer() {
      currentServer = currentServer === 'A' ? 'B' : 'A';
      document.getElementById("playerA").classList.remove("server");
      document.getElementById("playerB").classList.remove("server");
      document.getElementById("player" + currentServer).classList.add("server");
    }

    function addPoint(player) {
      if (player === 'A') scoreA++;
      else scoreB++;
      totalPoints++;
      if (totalPoints % 2 === 0) switchServer();
      updateScore();
      checkGameOver();
    }

    function removePoint(player) {
      if (player === 'A' && scoreA > 0) scoreA--;
      if (player === 'B' && scoreB > 0) scoreB--;
      updateScore();
    }

    function checkGameOver() {
      if ((scoreA >= 11 || scoreB >= 11) && Math.abs(scoreA - scoreB) >= 2) {
        alert(`Game over! ${scoreA > scoreB ? 'Speler A' : 'Speler B'} wint.`);
        scoreA = 0;
        scoreB = 0;
        totalPoints = 0;
        updateScore();
      }
    }

    let drawing = false;
    const canvas = document.getElementById('canvas');

    function setColor(c) { color = c; }

    canvas.addEventListener('pointerdown', e => {
      drawing = true;
      ctx.beginPath();
      ctx.moveTo(e.offsetX, e.offsetY);
    });

    canvas.addEventListener('pointermove', e => {
      if (drawing) {
        ctx.lineTo(e.offsetX, e.offsetY);
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    });

    canvas.addEventListener('pointerup', () => drawing = false);

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawLines();
    }

    function drawLines() {
      ctx.strokeStyle = "white";
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, canvas.height / 2);
      ctx.lineTo(canvas.width, canvas.height / 2);
      ctx.stroke();
    }

    drawLines();
  </script>
</body>
</html>
