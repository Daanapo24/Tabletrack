
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TableTrack</title>

</head>
<body>
    <div class="table-container">
        <div class="table-grid"></div>
    </div>

        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
